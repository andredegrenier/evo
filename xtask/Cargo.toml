[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
directories = "6.0.0"
# The fidelity harness draws with the same two rasterizers the app does, at the
# same versions the workspace lock file pins. See xtask/src/fidelity/render.rs
# for why the ~60 lines of render code are mirrored rather than imported.
hayro = "0.7"
ico = "0.4"
icns = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pdfium-render = "0.9.3"
resvg = "0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.3.0"
