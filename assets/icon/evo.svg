<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4c63"/>
      <stop offset="0.55" stop-color="#2a3446"/>
      <stop offset="1" stop-color="#1e2635"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d2dd"/>
      <stop offset="1" stop-color="#aab6c4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pageshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- page with folded corner -->
  <g filter="url(#pageshadow)">
    <path d="M 322 218
             L 610 218
             L 702 310
             L 702 806
             Q 702 826 682 826
             L 342 826
             Q 322 826 322 806
             L 322 238
             Q 322 218 342 218 Z"
          fill="url(#page)"/>
    <path d="M 610 218 L 702 310 L 630 310 Q 610 310 610 290 Z" fill="url(#fold)"/>
  </g>

  <!-- text lines -->
  <g fill="#b9c2ce">
    <rect x="376" y="380" width="272" height="26" rx="13"/>
    <rect x="376" y="440" width="272" height="26" rx="13"/>
    <rect x="376" y="500" width="196" height="26" rx="13"/>
  </g>

  <!-- highlight bar over one line -->
  <rect x="362" y="430" width="200" height="46" rx="10" fill="#fadc32" opacity="0.55"/>

  <!-- red pen swoosh -->
  <path d="M 330 742 Q 452 596 512 660 Q 560 712 700 540"
        fill="none" stroke="#dc2626" stroke-width="44" stroke-linecap="round"/>
  <circle cx="700" cy="540" r="30" fill="#dc2626"/>

  <!-- glass gloss over the tile -->
  <path d="M 64 264 Q 64 64 264 64 L 760 64 Q 960 64 960 264 L 960 420 Q 512 540 64 420 Z"
        fill="url(#gloss)"/>
</svg>
