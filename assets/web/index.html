<!doctype html>
<!--
  The whole app shell. Three views live in this file -- sign in, the library,
  one document -- and the router shows exactly one of them; there is no
  templating step and no build, so what is served is what is written here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="evo" />
    <title>evo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Sign in. Two legs: a password alone offers enrolment, a password and
         a code give a session. -->
    <section id="view-login" class="view" hidden>
      <form id="login" class="card sheet" autocomplete="on">
        <h1>evo</h1>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <label for="code">Authenticator code</label>
        <input
          id="code"
          name="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]*"
          maxlength="6"
          placeholder="000000"
        />

        <button type="submit" class="primary">Sign in</button>

        <div id="enroll" hidden>
          <p>
            Scan this with an authenticator app, then enter the code it shows.
          </p>
          <img id="qr" alt="Enrolment QR code" width="220" height="220" />
        </div>

        <p id="login-message" class="message" role="status"></p>
      </form>
    </section>

    <!-- The library. -->
    <section id="view-library" class="view" hidden>
      <header class="bar">
        <h1>evo</h1>
        <!-- Add and Agent each do one thing when tapped -- open the file
             picker, open the chat sheet -- so they are pill buttons with an
             icon rather than three words in a row, which read as a segmented
             control with "Add" selected. Sign out is a different kind of thing
             again, and sits past a divider. -->
        <div class="bar-actions">
          <label class="action" for="file">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 4.5v11M4.5 10h11" />
            </svg>
            Add
          </label>
          <input id="file" type="file" accept="application/pdf" multiple hidden />
          <button id="open-agent" class="action" type="button">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M16.5 11.5a2 2 0 0 1-2 2H8l-3.5 3v-3a2 2 0 0 1-1-1.7v-5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2z"
              />
            </svg>
            Agent
          </button>
          <span class="bar-divider" aria-hidden="true"></span>
          <button id="sign-out" class="link" type="button">Sign out</button>
        </div>
      </header>
      <div class="bar search">
        <input
          id="search"
          type="search"
          placeholder="Search the library"
          autocomplete="off"
          enterkeyhint="search"
        />
      </div>
      <p id="library-message" class="message" role="status"></p>
      <div id="grid" class="grid"></div>
      <ul id="hits" class="hits" hidden></ul>
    </section>

    <!-- One document: pages side by side, one per screen. -->
    <section id="view-doc" class="view viewer" hidden>
      <header class="bar viewer-bar">
        <button id="back" class="button quiet" type="button" aria-label="Back to the library">
          Back
        </button>
        <h1 id="doc-title"></h1>
        <span id="page-indicator" class="indicator"></span>
        <button id="open-chat" class="button quiet" type="button">Chat</button>
      </header>
      <!-- Markup. A tool is on or off; while one is on, a drag draws and a
           tap picks something already there. -->
      <div class="bar markup-bar">
        <button id="tool-highlight" class="button" type="button" aria-pressed="false">
          Highlight
        </button>
        <button id="tool-note" class="button" type="button" aria-pressed="false">
          Note
        </button>
        <span class="spacer"></span>
        <button id="delete-annotation" class="button danger" type="button" hidden>
          Delete
        </button>
      </div>
      <div id="pages" class="pages"></div>
      <p id="doc-message" class="message" role="status"></p>
    </section>

    <!-- Asking. A sheet over whatever is behind it, with two conversations in
         it: one about the document on screen, and one about the library, which
         can drive the app -- open a document, mark a page -- while you watch it
         happen behind the sheet. That is why it is not a view of its own. -->
    <section id="chat" class="chat" hidden>
      <header class="bar chat-tabs">
        <button id="tab-doc" class="tab" type="button" aria-selected="true">
          This document
        </button>
        <button id="tab-agent" class="tab" type="button" aria-selected="false">
          Agent
        </button>
        <span class="spacer"></span>
        <button id="chat-close" class="button quiet" type="button">Close</button>
      </header>

      <div id="panel-doc" class="panel">
        <div id="transcript" class="transcript"></div>
        <p id="chat-status" class="message" role="status"></p>
        <div class="bar allow">
          <label for="chat-tools">
            <input id="chat-tools" type="checkbox" />
            Allow tools
          </label>
        </div>
        <form id="chat-form" class="bar chat-ask">
          <input
            id="chat-question"
            type="text"
            placeholder="What is this about?"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button id="chat-send" class="primary" type="submit">Ask</button>
          <button id="chat-stop" class="button danger" type="button" hidden>Stop</button>
        </form>
      </div>

      <div id="panel-agent" class="panel" hidden>
        <div id="agent-transcript" class="transcript"></div>
        <p id="agent-status" class="message" role="status"></p>
        <div class="bar allow">
          <label for="agent-tools">
            <input id="agent-tools" type="checkbox" />
            Allow tools
          </label>
        </div>
        <form id="agent-form" class="bar chat-ask">
          <input
            id="agent-question"
            type="text"
            placeholder="Find something, and open or mark it"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button id="agent-send" class="primary" type="submit">Ask</button>
          <button id="agent-stop" class="button danger" type="button" hidden>Stop</button>
        </form>
      </div>
    </section>

    <!-- What a note says. A sheet rather than `prompt()`: a phone keyboard
         wants somewhere to put more than one line. -->
    <div id="note-sheet" class="backdrop" hidden>
      <form id="note-form" class="card sheet">
        <label for="note-text">Note</label>
        <textarea id="note-text" rows="3" placeholder="What is worth saying here?"></textarea>
        <div class="bar-actions">
          <button type="submit" class="primary">Add note</button>
          <button id="note-cancel" type="button" class="button quiet">Cancel</button>
        </div>
      </form>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
