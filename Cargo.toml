[package]
name = "evo"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
description = "A simple pure-Rust PDF editor: Preview-like viewing with Bluebeam-style precision markup"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andredegrenier/evo"
categories = ["gui", "graphics"]
keywords = ["pdf", "editor", "markup", "annotation"]

[dependencies]
argon2 = "0.5"
# Image stamps carry their PNG inside the markup JSON, and JSON's way of
# carrying bytes is base64.
base64 = "0.22"
axum ={ version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
catppuccin = "2.8"
directories = "6.0.0"
eframe = { version = "0.35", features = ["persistence"] }
egui-phosphor = "0.13"
# `evo fetch-pdfium` unpacks a .tgz. miniz_oxide by default, so still no C.
flate2 = "1"
getrandom = "0.4"
hayro = "0.7"
hayro-svg = "0.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
llama-cpp-2 = { version = "=0.1.154", default-features = false, optional = true }
lopdf = "0.44"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serialize"] }
# Only the AWS store, and none of object_store's own default backends: the
# local one here is `LocalBlobStore`, which was already written.
object_store = { version = "0.14", default-features = false, features = [
    "aws",
], optional = true }
ocrs = "0.12.2"
# The PDFium rasterizer. Default features on purpose: `thread_safe` puts a
# mutex around PDFium's single-threaded C API, which is what lets the render
# worker, the thumbnail threads and `evo serve` hold documents at once.
# Dynamically bound (libloading), so nothing here needs a C toolchain.
pdfium-render = { version = "0.9.3", optional = true }
redb = "4.1.0"
rfd = "0.17"
rmcp = { version = "3.1", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
    "transport-child-process",
]  }
rten = "0.24.0"
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
totp-rs = { version = "6", default-features = false, features = ["std", "qr"] }
ureq = "3.3.0"

# Mica/Acrylic are Windows window attributes, so they blur behind the window
# without adding anything to the view hierarchy. The macOS equivalent inserts a
# view over eframe's render layer and hid the entire UI, so evo no longer asks
# for it and no longer links the crate anywhere else.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.0"

[profile.release]
lto = "thin"

# hayro is a young CPU rasterizer; keep it optimized even in dev builds so
# page rendering stays interactive.
[profile.dev.package."*"]
opt-level = 2

[workspace]
members = [".", "xtask"]

[build-dependencies]
winresource = "0.1.31"

[features]
default = ["builtin-llm", "pdfium"]
# Embedded small language model (llama.cpp). Pulls in a C++ toolchain build.
builtin-llm = ["dep:llama-cpp-2"]
# The PDFium rasterizer, bound dynamically at runtime: no C toolchain, no
# compile-time dependency, and a build whose shared library is missing simply
# renders with hayro as it always did.
pdfium = ["dep:pdfium-render"]
# Blobs in an S3 bucket instead of on local disk. Off by default: it pulls in
# reqwest and rustls, which nobody serving a library off their own disk should
# have to compile. `cargo build --features s3`.
s3 = ["dep:object_store"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
