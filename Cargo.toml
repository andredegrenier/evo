[package]
name = "evo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A simple pure-Rust PDF editor: Preview-like viewing with Bluebeam-style precision markup"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andredegrenier/evo"
categories = ["gui", "graphics"]
keywords = ["pdf", "editor", "markup", "annotation"]

[dependencies]
directories = "6.0.0"
eframe = "0.35"
hayro = "0.7"
hayro-svg = "0.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lopdf = "0.44"
redb = "4.1.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.1"
thiserror = "2"
window-vibrancy = "0.8.0"

[profile.release]
lto = "thin"

# hayro is a young CPU rasterizer; keep it optimized even in dev builds so
# page rendering stays interactive.
[profile.dev.package."*"]
opt-level = 2

[workspace]
members = [".", "xtask"]

[build-dependencies]
winresource = "0.1.31"
