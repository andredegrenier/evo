[package]
name = "evo"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "A simple pure-Rust PDF editor: Preview-like viewing with Bluebeam-style precision markup"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andredegrenier/evo"
categories = ["gui", "graphics"]
keywords = ["pdf", "editor", "markup", "annotation"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
catppuccin = "2.8"
directories = "6.0.0"
eframe = { version = "0.35", features = ["persistence"] }
egui-phosphor = "0.13"
getrandom = "0.4"
hayro = "0.7"
hayro-svg = "0.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
llama-cpp-2 = { version = "=0.1.154", default-features = false, optional = true }
lopdf = "0.44"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serialize"] }
ocrs = "0.12.2"
redb = "4.1.0"
rfd = "0.17"
rmcp = { version = "3.1", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
    "transport-child-process",
]  }
rten = "0.24.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
ureq = "3.3.0"
window-vibrancy = "0.8.0"

[profile.release]
lto = "thin"

# hayro is a young CPU rasterizer; keep it optimized even in dev builds so
# page rendering stays interactive.
[profile.dev.package."*"]
opt-level = 2

[workspace]
members = [".", "xtask"]

[build-dependencies]
winresource = "0.1.31"

[features]
default = ["builtin-llm"]
# Embedded small language model (llama.cpp). Pulls in a C++ toolchain build.
builtin-llm = ["dep:llama-cpp-2"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
