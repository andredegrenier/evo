name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The optional S3 blob backend, on one platform only: it pulls in reqwest
      # and rustls, and what needs checking is that the code behind the feature
      # still compiles -- not that it does so three times.
      - run: cargo clippy --all-targets --features s3 -- -D warnings
        if: runner.os == 'Linux'
      # The pure-Rust build: no PDFium, no built-in model. `evo` has to keep
      # compiling without either, because that is what `cargo install` with
      # --no-default-features gives people.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo build
      - run: cargo test
      # xtask is a workspace member the root `cargo clippy`/`cargo test` do not
      # reach. Its tests include the fidelity smoke run -- evo's own committed
      # fixtures, no network, no PDFium, a couple of seconds -- which keeps the
      # harness compiling and honest between the monthly corpus runs in
      # fidelity.yml. `--include-ignored` is what pulls that one in.
      - run: cargo clippy -p xtask --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test -p xtask -- --include-ignored
        if: runner.os == 'Linux'
      # The PDFium pixel contract, on one platform. The library is pinned by
      # deploy/pdfium.lock and checked against its SHA-256, so a failure here
      # is a real failure and never a flaky download.
      - name: Fetch the pinned PDFium (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          set -a; . deploy/pdfium.lock; set +a
          curl -fsSL -o pdfium.tgz "$PDFIUM_BASE_URL/pdfium-linux-x64.tgz"
          echo "$PDFIUM_LINUX_X64_SHA256  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium && tar -xzf pdfium.tgz -C pdfium
          echo "EVO_PDFIUM_PATH=$PWD/pdfium/lib" >> "$GITHUB_ENV"
      - name: PDFium pixel contract (Linux)
        if: runner.os == 'Linux'
        run: cargo test -- --ignored pdfium_
