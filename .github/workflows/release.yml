name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: evo-macos-arm64
            binary: evo
          - os: macos-13
            artifact: evo-macos-x86_64
            binary: evo
          - os: ubuntu-latest
            artifact: evo-linux-x86_64
            binary: evo
          - os: windows-latest
            artifact: evo-windows-x86_64
            binary: evo.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          tar -czf ../../${{ matrix.artifact }}.tar.gz ${{ matrix.binary }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/${{ matrix.binary }} -DestinationPath ${{ matrix.artifact }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
