name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than a per-arch pair: the macos-13
          # (Intel) runners queue for hours and starved v0.3.0 of its x86_64
          # asset.
          - os: macos-latest
            artifact: evo-macos-universal
            binary: evo
          - os: ubuntu-latest
            artifact: evo-linux-x86_64
            binary: evo
          - os: windows-latest
            artifact: evo-windows-x86_64
            binary: evo.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release
      - name: Build universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          # Everything downstream reads target/release/evo, which a
          # --target build never writes to.
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/evo \
            target/x86_64-apple-darwin/release/evo \
            -o target/release/evo
      - name: Show binary architectures (macOS)
        if: runner.os == 'macOS'
        run: lipo -archs target/release/evo
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          tar -czf ../../${{ matrix.artifact }}.tar.gz ${{ matrix.binary }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/${{ matrix.binary }} -DestinationPath ${{ matrix.artifact }}.zip
      - name: Assemble .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=evo.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp target/release/evo "$APP/Contents/MacOS/evo"
          cp assets/icon/evo.icns "$APP/Contents/Resources/evo.icns"
          codesign --force --deep -s - "$APP"
          zip -r ${{ matrix.artifact }}.app.zip "$APP"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.app.zip
